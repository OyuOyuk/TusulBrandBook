steps:
  - name: 'gcr.io/k8s-skaffold/pack'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        pack build "$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$_LOW_REPO/$_SERVICE_NAME:$COMMIT_SHA" \
          --builder=gcr.io/buildpacks/builder:latest \
          --publish

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$_LOW_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'backend-api-brandbook@study-on-se.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _SERVICE_NAME: brand-book-backend
  _LOW_REPO: tusulbrandbook