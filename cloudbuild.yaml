steps:
  - name: gcr.io/k8s-maintainers/buildpack
    args:
      - build
      - '--builder=gcr.io/buildpacks/builder:v1'
      - '--publish'
      - '$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$SERVICE_NAME:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _SERVICE_NAME: your-service-name-here